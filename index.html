<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf4de">
<title>Una sorpresa para Mónica</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;700;800&display=swap');
:root{--cream:#fbf4de;--ink:#2b1b3d;--ink-soft:#4a3763;--marigold:#f2b705;--purple:#8c6fe6;--purple-deep:#6a4fc4;--pink:#df9bb5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 15% 15%,#fffdf2 0,transparent 38%),radial-gradient(ellipse at 85% 85%,#eadfff 0,transparent 35%),var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif}body{min-height:100svh;display:grid;place-items:center;padding:26px 18px;overflow:hidden}.box{width:min(520px,100%);position:relative;text-align:center;padding:clamp(28px,7vw,48px) clamp(20px,6vw,42px);border:1px solid #ffffffc9;border-radius:32px;background:#fffdf2d9;box-shadow:0 25px 90px #6a4fc420,inset 0 1px #fff;backdrop-filter:blur(10px);animation:arrive .9s cubic-bezier(.2,.8,.2,1) both}.emoji{font-size:3.3rem;line-height:1;margin-bottom:14px;filter:drop-shadow(0 9px 10px #f2b70544);animation:bob 3s ease-in-out infinite}h1{font-family:Fraunces,Georgia,serif;font-size:clamp(1.7rem,6vw,2.35rem);line-height:1.15;margin:0 0 14px}.box>p{font-size:1rem;line-height:1.65;color:var(--ink-soft);margin:0 0 10px}.date{font-weight:800;color:var(--purple-deep)}.joke{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.2rem;line-height:1.55;color:var(--ink);margin:18px 0 0!important}.joke-emoji{font-size:1.5rem;vertical-align:middle;display:inline-block;animation:peek 2.2s ease-in-out infinite}.countdown-row{margin-top:23px;display:flex;justify-content:center;gap:clamp(8px,3vw,17px)}.unit{display:flex;flex-direction:column;align-items:center;min-width:clamp(48px,13vw,65px);padding:9px 5px 7px;border-radius:15px;background:#f4edff;border:1px solid #8c6fe633;box-shadow:0 5px 16px #6a4fc40d}.value{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(1.65rem,7vw,2.1rem);line-height:1.15;color:var(--purple-deep);font-variant-numeric:tabular-nums}.label{font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}.float{position:fixed;pointer-events:none;opacity:.68;animation:float 7s ease-in-out infinite}.f1{top:9%;left:10%;font-size:2rem}.f2{top:17%;right:10%;font-size:1.7rem;animation-delay:-2s}.f3{bottom:12%;left:13%;font-size:1.8rem;animation-delay:-3.5s}.f4{bottom:10%;right:12%;font-size:2rem;animation-delay:-1s}.f5{top:49%;left:4%;font-size:1.2rem;animation-delay:-4s}.f6{top:55%;right:5%;font-size:1.3rem;animation-delay:-2.5s}@keyframes arrive{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}@keyframes peek{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}@media(max-width:420px){.box{border-radius:25px}.countdown-row{gap:6px}.unit{min-width:0;flex:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<span class="float f1" aria-hidden="true">🌸</span><span class="float f2" aria-hidden="true">💜</span><span class="float f3" aria-hidden="true">🌷</span><span class="float f4" aria-hidden="true">✨</span><span class="float f5" aria-hidden="true">💖</span><span class="float f6" aria-hidden="true">🌼</span>
<main class="box"><div class="emoji" aria-hidden="true">🎁🌻</div><h1>Ya casi llega tu sorpresa, mi Mónica</h1><p>Este regalo se abrirá el <span class="date">30 de octubre de 2026 a las 7:00 a. m.</span></p><p class="joke">No hagas trampa, mi amor 👀 todavía falta un poquito… aunque sé que te gana la curiosidad, jsjsjs.</p><div class="countdown-row" aria-label="Cuenta regresiva"><div class="unit"><span class="value" id="cdDays">00</span><span class="label">Días</span></div><div class="unit"><span class="value" id="cdHours">00</span><span class="label">Horas</span></div><div class="unit"><span class="value" id="cdMinutes">00</span><span class="label">Minutos</span></div><div class="unit"><span class="value" id="cdSeconds">00</span><span class="label">Segundos</span></div></div></main>
<script>
(()=>{const target=Date.parse('2026-10-30T07:00:00-05:00');const ids=['cdDays','cdHours','cdMinutes','cdSeconds'];const els=ids.map(id=>document.getElementById(id));const pad=n=>String(n).padStart(2,'0');let timer;function tick(){const diff=target-Date.now();if(diff<=0){clearInterval(timer);window.location.replace('index2.html');return}const values=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];els.forEach((el,i)=>el.textContent=pad(values[i]))}tick();timer=setInterval(tick,1000)})();
</script>
</body>
</html>
